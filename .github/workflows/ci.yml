name: Ya Viene Backend CI

on:
  # Solo main. Se trabaja en `prueba` y cada commit sube a las dos ramas a
  # la vez: con las dos aquí, el mismo commit se probaba dos veces y se
  # pagaban dos veces los minutos, que en un repo privado tienen cuota.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# El token de la corrida se le presta a código de terceros, así que va con lo
# mínimo: ningún job de aquí escribe en el repositorio. Sin este bloque iba
# con los permisos por omisión, que incluyen escritura.
permissions:
  contents: read

# Si llega un commit nuevo a la misma rama mientras la corrida anterior
# sigue, la vieja se cancela: su resultado ya no le importa a nadie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cada acción va clavada al commit y no a la etiqueta: una etiqueta se mueve
# sin avisar y con ella cambia el código de terceros que corre con ese token.
# La versión legible queda al lado; para subir una se resuelve la etiqueta con
# `gh api repos/DUEÑO/ACCION/commits/ETIQUETA --jq .sha` y se cambian el SHA y
# el comentario en el mismo commit. Las elegidas corren en Node 24: GitHub
# quita Node 20 de sus runners el 16 de septiembre de 2026 y las @v4 dejan de
# arrancar.
jobs:
  # Barrido de secretos (T3.12). gitleaks-action revisa los commits del push
  # o del PR, no el árbol: no tiene modo sin git. Necesita el historial
  # completo, y los falsos positivos ya revisados van en .gitleaksignore.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # La misma versión que el Dockerfile y `engines`, leída de un solo
          # sitio para que la CI no pruebe con un Node distinto al de Fly.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Trinquete de cobertura (T8.7): las mismas pruebas de `npm test`, más
      # los umbrales. Están en la cobertura del día que se puso —líneas 92,
      # ramas 79, funciones 92, con un punto de holgura porque el reparto de
      # las pruebas en paralelo mueve el último decimal— y solo suben: quien
      # los baje tiene que decir en el commit por qué.
      - run: npm run test:cobertura
      - run: npm audit --omit=dev --audit-level=high
      # Las de desarrollo también: tsx, los tipos y el runner corren en esta
      # máquina con el código del repo, y una rota ahí es una puerta abierta.
      - run: npm audit --audit-level=high
