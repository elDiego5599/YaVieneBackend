# Ya Viene — despliegue del backend en Fly.io.
#
# El objetivo de esto es una URL que no cambie. BACKEND_URL en las apps es
# una constante de compilación (String.fromEnvironment), así que cada vez
# que la URL cambiaba había que recompilar y repartir las dos apps de nuevo.

app = "ya-viene-backend"
primary_region = "bog"   # Bogotá, la región más cercana a Barranquilla.

[build]

[env]
  # La base vive en el volumen, no en la imagen: así sobrevive a cada deploy.
  YA_VIENE_DB_PATH = "/app/data/yaviene.db"

# El volumen es lo que hace persistente a SQLite. Se siembra sola al
# arrancar (src/data/database.ts crea el esquema e inserta Sobusa EMP-01 con
# el catálogo real de rutas), así que un volumen vacío se llena en el primer
# arranque.
[mounts]
  source = "yaviene_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true

  # Un solo servicio para todo: la API, el WebSocket de socket.io (/ws) y el
  # MQTT sobre WebSocket (/mqtt) comparten el puerto 3000. El MQTT por TCP
  # sigue escuchando solo en loopback, como está diseñado, y por eso no se
  # expone ningún puerto más.

  # Si la máquina se duerme se mueren los buses simulados y el pasajero abre
  # el mapa vacío. Para la presentación en AMBQ eso no puede pasar, así que
  # la máquina se queda despierta.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Una sola máquina, a propósito: SQLite con un volumen no se reparte entre
  # varias. Si algún día hacen falta más, primero hay que cambiar de motor.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB en vez de 256: además del backend, dentro de esta misma máquina
  # corren los dos buses simulados de la demo (dos procesos de Node más).
  memory = "512mb"
