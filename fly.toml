# Ya Viene — despliegue del backend en Fly.io.
#
# El objetivo de esto es una URL que no cambie. BACKEND_URL en las apps es
# una constante de compilación (String.fromEnvironment), así que cada vez
# que la URL cambiaba había que recompilar y repartir las dos apps de nuevo.

app = "ya-viene-backend"
# Fly retiró Bogotá, Miami y Santiago: de las regiones que quedan, la más
# cercana a Barranquilla en tiempo de red es Ashburn. El tráfico de los ISP
# colombianos sale por Miami y de ahí sube a la costa este, así que iad es
# el salto más corto disponible (~60 ms) — dfw y gru quedan más lejos.
primary_region = "iad"

[build]

[env]
  # La base vive en el volumen, no en la imagen: así sobrevive a cada deploy.
  YA_VIENE_DB_PATH = "/app/data/yaviene.db"
  # El TLS lo termina el proxy de Fly (force_https, más abajo) y a la máquina
  # le llega el tráfico por la red privada de Fly. Sin esta línea el backend
  # se niega a arrancar en producción sin certificado propio (src/config.ts).
  HTTP_TLS_EXTERNO = "1"
  # En producción la flota simulada viene apagada (src/config.ts,
  # flotaDemoHabilitada). Aquí se enciende a propósito: para el pitch, Fly es
  # un espejo de la demo de ngrok y sin buses rodando el respaldo enseñaría un
  # mapa vacío (decisión D1 del plan de remediación). Cuando Fly pase a ser el
  # respaldo real del piloto, esta línea se cambia a "0". El arranque deja un
  # aviso en el log mientras esté en "1".
  YA_VIENE_FLOTA_DEMO = "1"
  # PIN con el que los buses simulados registran e inician sesión. La flota
  # demo de arriba viene encendida, y validateConfig no deja arrancar con la
  # flota encendida y sin PIN: antes el script usaba «1234» por omisión.
  # El valor es el mismo de siempre (los conductores demo del volumen lo
  # tienen hasheado); con la flota en "0" esta línea se puede borrar.
  PIN = "1234"

# El volumen es lo que hace persistente a SQLite. Se siembra sola al
# arrancar (src/data/database.ts crea el esquema e inserta Sobusa EMP-01 con
# el catálogo real de rutas), así que un volumen vacío se llena en el primer
# arranque.
[mounts]
  source = "yaviene_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true

  # Un solo servicio para todo: la API, el WebSocket de socket.io (/ws) y el
  # MQTT sobre WebSocket (/mqtt) comparten el puerto 3000. El MQTT por TCP
  # sigue escuchando solo en loopback, como está diseñado, y por eso no se
  # expone ningún puerto más.

  # Escala a cero mientras no se use. Fuera de las pruebas y de la
  # presentación esta máquina no debe costar nada, y una máquina parada en
  # Fly no factura CPU ni memoria: lo único que se sigue pagando es el
  # volumen (1 GB).
  #
  # `auto_start_machines` sigue en true a propósito: así la URL de Fly sirve
  # de respaldo del túnel de ngrok. Si ngrok se cae, la primera petición que
  # llegue aquí levanta la máquina sola (arranque en frío de unos segundos).
  #
  # OJO para el día de la presentación: con la máquina dormida no hay buses
  # simulados rodando, porque los lanza el propio proceso al arrancar y
  # tardan un momento en aparecer en el mapa. Antes de presentar hay que
  # dejarla despierta:
  #
  #     fly scale count 1 --yes && fly machine start
  #
  # y volver a `min_machines_running = 1` si se quiere que no se duerma sola
  # a mitad de la demo.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Una sola máquina, a propósito: SQLite con un volumen no se reparte entre
  # varias. Si algún día hacen falta más, primero hay que cambiar de motor.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB en vez de 256: además del backend, dentro de esta misma máquina
  # corren los dos buses simulados de la demo (dos procesos de Node más).
  memory = "512mb"
