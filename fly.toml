# Ya Viene — despliegue del backend en Fly.io.
#
# El objetivo de esto es una URL que no cambie. BACKEND_URL en las apps es
# una constante de compilación (String.fromEnvironment), así que cada vez
# que la URL cambiaba había que recompilar y repartir las dos apps de nuevo.

app = "ya-viene-backend"
# Fly retiró Bogotá, Miami y Santiago: de las regiones que quedan, la más
# cercana a Barranquilla en tiempo de red es Ashburn. El tráfico de los ISP
# colombianos sale por Miami y de ahí sube a la costa este, así que iad es
# el salto más corto disponible (~60 ms) — dfw y gru quedan más lejos.
primary_region = "iad"

[build]

[env]
  # La base vive en el volumen, no en la imagen: así sobrevive a cada deploy.
  YA_VIENE_DB_PATH = "/app/data/yaviene.db"
  # El TLS lo termina el proxy de Fly (force_https, más abajo) y a la máquina
  # le llega el tráfico por la red privada de Fly. Sin esta línea el backend
  # se niega a arrancar en producción sin certificado propio (src/config.ts).
  HTTP_TLS_EXTERNO = "1"
  # En producción la flota simulada viene apagada (src/config.ts,
  # flotaDemoHabilitada). Aquí se enciende a propósito: para el pitch, Fly es
  # un espejo de la demo de ngrok y sin buses rodando el respaldo enseñaría un
  # mapa vacío (decisión D1 del plan de remediación). Cuando Fly pase a ser el
  # respaldo real del piloto, esta línea se cambia a "0". El arranque deja un
  # aviso en el log mientras esté en "1".
  YA_VIENE_FLOTA_DEMO = "1"
  # La flota demo firma sus JWT dentro del backend y no necesita un PIN
  # global. Si Fly conserva el secreto antiguo, quitarlo con
  # `fly secrets unset PIN` (docs/runbook.md, «Fly, el respaldo»).
  # Con NODE_ENV=production una base nueva nace vacía (src/config.ts,
  # siembraDemoHabilitada). El espejo de la demo necesita a Sobusa (EMP-01) y
  # su catálogo de rutas, que es lo que recorre la flota de arriba. En un
  # volumen ya sembrado no cambia nada: las migraciones aplicadas no se
  # repiten. Para el piloto real, "0" o borrar la línea.
  YA_VIENE_SEED_DEMO = "1"

# El volumen es lo que hace persistente a SQLite. src/data/database.ts crea
# el esquema al arrancar y, con YA_VIENE_SEED_DEMO=1 (arriba), inserta Sobusa
# EMP-01 con el catálogo real de rutas, así que un volumen vacío se llena en
# el primer arranque.
[mounts]
  source = "yaviene_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true

  # Un solo servicio para todo: la API, el WebSocket de socket.io (/ws) y el
  # MQTT sobre WebSocket (/mqtt) comparten el puerto 3000. El MQTT por TCP
  # sigue escuchando solo en loopback, como está diseñado, y por eso no se
  # expone ningún puerto más.

  # Siempre prendida (dueño, 2026-11-02, para la reunión con el AMB del 6 de
  # noviembre): la flota simulada la lanza el propio proceso al arrancar, así
  # que con la máquina dormida el respaldo enseñaría un mapa vacío los
  # primeros segundos. Cuesta unos 3,5 USD al mes (shared-cpu-1x con 512 MB
  # todo el mes, más el volumen de 1 GB).
  #
  # Para volver a dormirla y pagar solo el volumen: auto_stop_machines =
  # "stop" y min_machines_running = 0, y desplegar. `auto_start_machines`
  # sigue en true para que, si la máquina se cae, la primera petición la
  # levante sola.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Una sola máquina, a propósito: SQLite con un volumen no se reparte entre
  # varias. Si algún día hacen falta más, primero hay que cambiar de motor.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB en vez de 256: el backend mueve la flota demo en su propio
  # proceso, con un solo temporizador compartido por todos los buses.
  memory = "512mb"
